name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check release versions
        run: python tools/check_versions.py
      - name: Check text format
        run: python tools/check_text_format.py
      - name: Run JavaScript contracts
        run: node --test test/*.test.mjs SOZO-ESP32-S3/test/*.test.mjs

  native:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Common Native Tests
            runner: platformio
            project: SOZO-Common
            environment: native
          - name: Gateway Node Logic Tests
            runner: host
            target: gateway-node
          - name: C3 Node Runtime Tests
            runner: host
            target: c3-node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        if: matrix.runner == 'platformio'
        run: python -m pip install platformio==6.1.19
      - name: Run Common native tests
        if: matrix.runner == 'platformio'
        run: platformio test --project-dir "${{ matrix.project }}" --environment "${{ matrix.environment }}"
      - name: Run component native tests
        if: matrix.runner == 'host'
        run: python tools/run_native_tests.py "${{ matrix.target }}"
