name: Firmware Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gateway S3
            project: SOZO-ESP32-S3
            environment: esp32-s3-devkitc-1
          - name: Node C3
            project: SOZO-ESP32-C3
            environment: esp32-c3-supermini

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build firmware
        run: platformio run --project-dir "${{ matrix.project }}" --environment "${{ matrix.environment }}"

      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: sozo-flux-${{ matrix.environment }}
          path: ${{ matrix.project }}/.pio/build/${{ matrix.environment }}/firmware.bin
          if-no-files-found: error
